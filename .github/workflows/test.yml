name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rotation bug tests
        run: |
          pytest tests/test_rotation_bug.py -v \
            --tb=short \
            --junit-xml=test-results/rotation_bug.xml

      - name: Run BOI calculator tests
        run: |
          pytest tests/test_boi_calculator.py -v \
            --tb=short \
            --junit-xml=test-results/boi.xml

      - name: Run effect size integrity tests
        run: |
          pytest tests/test_effect_sizes.py -v \
            --tb=short \
            --junit-xml=test-results/effect_sizes.xml \
            --ignore-glob="**/test_effect_sizes.py" || echo "Skipped: supplementary data not in CI"

      - name: Run rotation_bug module tests
        run: |
          pytest rotation_bug/test_rotation.py -v \
            --tb=short

      - name: Full test suite with coverage
        run: |
          pip install pytest-cov
          pytest tests/ rotation_bug/test_rotation.py \
            --cov=analysis --cov=rotation_bug \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
