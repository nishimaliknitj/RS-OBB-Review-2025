name: Compile LaTeX PDF

on:
  push:
    branches: [ main, master ]
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  latex:
    name: Build paper PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            latexmk

      - name: Compile PDF (3 passes)
        run: |
          cd paper
          pdflatex -interaction=nonstopmode final_main.tex
          pdflatex -interaction=nonstopmode final_main.tex
          pdflatex -interaction=nonstopmode final_main.tex

      - name: Check for errors in log
        run: |
          cd paper
          # Fail if any hard LaTeX errors found
          if grep -q "^!" final_main.log; then
            echo "LaTeX ERRORS found:"
            grep "^!" final_main.log
            exit 1
          fi
          # Check for multiply-defined labels
          if grep -q "multiply defined" final_main.log; then
            echo "WARNING: multiply-defined labels found:"
            grep "multiply defined" final_main.log
          fi
          echo "No hard errors found."

      - name: Check PDF size
        run: |
          SIZE=$(stat -c%s paper/final_main.pdf)
          echo "PDF size: $SIZE bytes ($(echo "$SIZE/1024/1024" | bc) MB)"
          # Warn if PDF seems too small (< 1MB = something went wrong)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "WARNING: PDF smaller than 1MB — may be incomplete"
          fi

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/final_main.pdf
          retention-days: 90

      - name: Check warnings summary
        run: |
          echo "=== LaTeX Warnings Summary ==="
          grep "LaTeX Warning" paper/final_main.log | sort | uniq -c | sort -rn || true
          echo "=== Done ==="
